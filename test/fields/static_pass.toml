# The findings the static pass, test/fields/static_pass.jl, accepts. Each [[accepted]] entry
# names one finding by analysis, kind, file, method and message, as the pass prints it, and
# carries the reason it stands and the tracker row that removes it.

[[accepted]]
analysis = "report_call"
kind = "MethodErrorReport"
file = "src/Coupling/loops.jl"
method = "Fiddlybits.Coupling.#scatter_report#"
message = "no matching method found `getindex(::Tuple, ::Nothing)` (1/2 union split)"
reason = "the index is read after (i !== nothing && ...) || refuse(...), which refuses a nothing; inference does not carry the check on i through the combined condition to the index"
row = "fiddlybits-52v.3.18"

[[accepted]]
analysis = "report_call"
kind = "MethodErrorReport"
file = "src/Coupling/state.jl"
method = "Fiddlybits.Coupling.declaration_of"
message = "no matching method found `declare(::Any)`"
reason = "declare is called behind a hasmethod guard that refuses a component without a method; inference does not read the guard"
row = "fiddlybits-52v.3.18"

[[accepted]]
analysis = "report_call"
kind = "MethodErrorReport"
file = "src/Fields/vectors.jl"
method = "Fiddlybits.Fields.transform"
message = "no matching method found `lift(::Tuple{Fiddlybits.Fields.Field, Fiddlybits.Fields.Field}, ::Fiddlybits.Fields.LocalFrame{Basis, 1} where Basis)`, `lift(::Tuple{Fiddlybits.Fields.Field}, ::Fiddlybits.Fields.LocalFrame{Basis, 2} where Basis)` (2/4 union split)"
reason = "transform is written over a frame of free arity, so project's one-axis and two-axis returns are crossed with the other frame; lift has a method for each arity it is called with"
