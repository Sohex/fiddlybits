# ---------------------------------------------------------------- protocols
#
# One entry per published protocol a row runs on. system is the protocol's system as
# Sourced constructor calls; normalisation is what the protocol held fixed. A bar on
# a row naming a protocol applies to a run of that system with that normalisation
# held, and with no field changed but the one the row's statistic names as swept
# (docs/oracles/README.md, Verdicts).

[[protocol]]
id = "jablonowski_williamson"
system = "the published baroclinic instability case's planet as a Sourced constructor: radius, rotation rate, gravity, gas constants and surface pressure from the case definition, with its analytic balanced initial state"
normalisation = "the analytic initial state at the published surface pressure, unforced and with no surface fluxes"

[[protocol]]
id = "held_suarez"
system = "HeldSuarez() at the published radius, gravity, gas constant and surface pressure as Sourced fields"
normalisation = "the forcing profile and the relaxation rates in seconds"

[[protocol]]
id = "dcmip_small_planet"
system = "the published small-planet case as a Sourced constructor: radius divided and rotation multiplied by the published factor from the Earth-parameter base"
normalisation = "gravity, gas constants and surface pressure at the case definition's values, Sourced from it"

[[protocol]]
id = "ape"
system = "APE() as a Sourced constructor from the APE protocol paper: its radius, gravity, rotation, surface pressure, gas constants, solar constant and spectrum, and the prescribed sea-surface temperature profile, every field Sourced"
normalisation = "prescribed surface, equal total instellation"

[[protocol]]
id = "rotation_rate_sweep"
system = "the published sweep's base system as a Sourced constructor (its radius, gravity, surface pressure, composition and forcing)"
normalisation = "the base system's instellation and column mass"

[[protocol]]
id = "obliquity_sweep"
system = "each published study's base system as a Sourced constructor (radius, gravity, rotation, surface pressure, composition, land configuration, instellation)"
normalisation = "the base system's instellation and eccentricity"

[[protocol]]
id = "gravity_sweep"
system = "the published sweep's base system as a Sourced constructor"
normalisation = "column mass (surface pressure scales with gravity), as the published studies hold it"

[[protocol]]
id = "thai"
system = "THAI_Hab1() and THAI_Hab2() as Sourced constructors from the THAI protocol (planet radius, gravity, synchronous rotation period, surface pressure, composition, ocean depth and the protocol's stellar spectrum as a docs/inputs manifest), every field Sourced"
normalisation = "the protocol's instellation and column mass"

[[protocol]]
id = "stellar_type_equal_instellation"
system = "the base systems of the Shields et al. and Godolt et al. stellar-type comparisons as Sourced constructors"
normalisation = "equal total instellation"

# ---------------------------------------------------------------- instruments
#
# One entry per instrument rows measure a statistic or a bar with and no row judges.
# definition says what the instrument is, how it is run and what a measurement by it
# is admissible as, naming its numbers by the constants that hold them; parameters
# maps each such constant, qualified from the Fiddlybits module, to the number it
# holds, and oracles.registry_wellformed checks each against the code
# (docs/oracles/README.md, Registration).

[[instrument]]
id = "ulp_ensemble"
definition = "The ensemble holds Backends.ENSEMBLE_MEMBERS members drawn without replacement from the case's usable sites, ordered by the SHA-256 digest of the seed, the field and the cell under Backends.ENSEMBLE_SEED, which the Envelope carries beside the members it drew; it detects a miss rate of Backends.ENSEMBLE_MISS_RATE, from notes/findings/2026-09-11-ulp-ensemble-member-count.md. That miss rate is a probability over the seed of the draw: a sub-population of at least that relative size, fixed without reference to the seed, is missed with probability at most one in Backends.ENSEMBLE_CONFIDENCE_RECIPROCAL, resting on the digest ordering sites as a uniformly random permutation would; for the one declared seed a given sub-population is held or missed, from docs/decisions/0052-the-sampled-ensemble-is-a-seeded-draw.md. That miss rate is a relative size and holds for the sampled arm alone: a certification of a case that declares an Obligation is not admissible from the sampled arm alone, because a sub-population fixed in count rather than in share, such as the twelve degree-five vertices decision 0005 puts at every level of an icosahedral mesh, falls below the declared miss rate as the mesh refines and the sampled arm cannot by construction be sized to reach it. src/Backends/certify.jl: Backends.certify refuses a verdict that leaves an Obligation uncovered, and Backends.case_certification runs the sampled arm and every obligation's own exhaustive arm before a case is certified. The envelope is measured by perturbing one cell by one ulp at the precision being certified, at every step an error could be injected at rather than at the initial state alone; at the certified precision the exhaustive envelope of a linear stationary step is the operator one norm of its propagator, and the level built from it is an upper bound on the divergence only where the step is linear and stationary, the ensemble is exhaustive and the amplitude is the certified one, and elsewhere is a bar the case measured for itself, from notes/findings/2026-09-12-ulp-ensemble-amplitude-and-injection-step.md."
parameters = { "Backends.ENSEMBLE_MEMBERS" = 766, "Backends.ENSEMBLE_SEED" = 0, "Backends.ENSEMBLE_MISS_RATE" = 3.9032401194668553e-3, "Backends.ENSEMBLE_CONFIDENCE_RECIPROCAL" = 20 }
