# Oracle registry skeleton. Every entry is provisional and unregistered.
# A threshold becomes binding only when registered_at names the commit that fixed
# it, before the first artifact it judges exists. Values marked "provisional" are
# placeholders to be set at the registering milestone.
#
# Fields: id, tier (1 identity/analytic | 2 earth | 3 published_spread), subsystem,
# dataset_or_reference, statistic, verdict_kind (fail_bar | report | pass_bar),
# threshold, provisional, registered_at, holdout, anchors (references by title).
# Optional: protocol_system (tier 3 only): the Sourced constructor call of the
# protocol's system and the normalisation the protocol held fixed; the bar applies
# to that instance only and any other configuration through the case is REPORT.
# Optional: instances (tier 1 system.* rows): the test instances the identity runs
# on; every system.* row runs on Earth() and on a synthetic non-Earth instance.
# Conventions: statistics and thresholds in SI seconds and dimensionless or
# system-derived units; a published case's day written as its seconds on the arm
# where the published bar applies, with the spread-arm rule stated; vertical
# diagnostics in sigma, never a fixed pressure (docs/oracles/README.md).

# ---------------------------------------------------------------- tier 1: build and dependencies

[[oracle]]
id = "build.module_order_acyclic"
tier = 1
subsystem = "build"
dataset_or_reference = "identity"
statistic = "the include order of src/Fiddlybits.jl against a topological order of the inter-module reference graph recovered by parsing each submodule for references to the others"
verdict_kind = "fail_bar"
threshold = "exact; the include order is a topological order of the recovered graph, and the graph has no cycle (positive controls: a fixture pair with a back reference, which must be reported, and a fixture pair with a forward reference, which must not)"
provisional = true
registered_at = ""
holdout = false
anchors = []

[[oracle]]
id = "build.import_record_completeness"
tier = 1
subsystem = "build"
dataset_or_reference = "identity"
statistic = "every non-stdlib entry of Project.toml against docs/imports, matched by the record's heading: a record exists, it names at least one leak check, and every named check resolves to a test path that exists or an oracle id in this registry"
verdict_kind = "fail_bar"
threshold = "exact; no entry without a record, no record naming nothing, and no named check that does not resolve (positive controls: a fixture project entry with no record, and a fixture record naming an absent test file, both of which must be refused)"
provisional = true
registered_at = ""
holdout = false
anchors = []

[[oracle]]
id = "build.manifest_exclusions"
tier = 1
subsystem = "build"
dataset_or_reference = "identity"
statistic = "the resolved Manifest.toml against the exclusion list, whose entries each name the import record that excluded the package"
verdict_kind = "fail_bar"
threshold = "exact; no excluded name anywhere in the resolved manifest, direct or transitive, and no exclusion entry without a record (positive control: a fixture manifest containing an excluded name, which must be refused)"
provisional = true
registered_at = ""
holdout = false
anchors = []

[[oracle]]
id = "build.lint_positive_controls"
tier = 1
subsystem = "build"
dataset_or_reference = "identity"
statistic = "each lint of the suite run against its dirty fixture and its clean fixture"
verdict_kind = "fail_bar"
threshold = "exact; every lint flags its dirty fixture and passes its clean one, and a lint with no dirty fixture fails the suite rather than passing vacuously (positive control: the dirty fixture of one lint removed, which must fail)"
provisional = true
registered_at = ""
holdout = false
anchors = []

[[oracle]]
id = "build.load_latency"
tier = 1
subsystem = "build"
dataset_or_reference = "known quantity"
statistic = "wall time of using Fiddlybits on the recorded host, with the load average and the preference state recorded beside it; and the three assertions this entry carries as the leak check docs/imports/precompiletools.md names: no preference turns the precompilation workload off, the package image exists, and the workload landed in it"
verdict_kind = "fail_bar"
threshold = "provisional; the A/A scatter is notes/findings/2026-09-11-load-latency-instrument.md and the ceiling stays unset for two further reasons: the package is almost all empty module declarations, so the number does not describe the package a bar would judge, and the bed does not hold the memory system still, neighbours taking no core the measurement needs moving it by many times the quiet range (fiddlybits-52v.1.8). A bar narrower than its instrument's scatter is refused at registration (decision 0029). Positive controls: the measurement judged against a ceiling below the measured value must FAIL; a preferences file turning either workload switch off must be refused, and one turning neither off must not be; a package on the load path that nothing loads must read as not precompiled; a method the workload does not call must carry no cached specialization"
provisional = true
registered_at = ""
holdout = false
anchors = []

# ---------------------------------------------------------------- tier 1: system, clock and star

[[oracle]]
id = "system.kepler_period"
tier = 1
subsystem = "system"
dataset_or_reference = "identity"
statistic = "orbital period derived from the declared masses and semi-major axis of every body pair in the orbit hierarchy against the analytic Kepler value; eccentric anomaly from the Kepler solve against a high-precision reference at declared eccentricities up to the highest the synthetic instance declares, and at 1 - 1e-12 as the positive control. The anomaly arm samples the eccentric anomaly and derives the mean anomaly from it, spaced logarithmically toward zero below 45 degrees at every eccentricity above 0.75; a sample uniform in mean anomaly does not reach that region and every route passes it (notes/findings/2026-09-10-sampling-the-kepler-hard-region.md)"
verdict_kind = "fail_bar"
threshold = "eccentric anomaly within 2 ulps of pi of the reference at every eccentricity, and relative error below 1e-15; reachable only with the residual and derivative of Markley equations 30 to 35 (notes/findings/2026-09-10-kepler-in-a-portable-kernel.md), so the naive residual is the positive control and must fail, as must Markley equations 20 to 29 unrefined and the stable residual with its series truncated to five terms. The reference is bisection at 300 bits on a bracket the root is interior to, controlled by its own residual; where the mean anomaly is derived from a chosen eccentric anomaly, the derived reference shift must stay below a twentieth of this bar"
provisional = true
registered_at = ""
holdout = false
anchors = ["Solar System Dynamics"]
instances = ["Earth()", "SyntheticNonEarth()"]

