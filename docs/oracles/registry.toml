e of that face, and the source's discrete geostrophic wind v_i = r_d^2 delta_i of the corner height, in units of f d, the corner height the area-weighted mean of the triangle-centre heights around the vertex; the window in f t from 0 to 50 x 0.1/sqrt(1 + r_d^2), the source's 50 steps at its nondimensional step (section 8 and its footnote 4, p. 2717, and Fig. 5, p. 2718)"
