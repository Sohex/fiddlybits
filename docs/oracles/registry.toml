threshold = "roundoff where the event exists; NotEvaluable by name for the vernal equinox where the sine of the obliquity does not exceed the rounding of the subsolar latitude, and for a periapsis where the eccentricity does not exceed the rounding of the distance (positive controls: the vernal equinox on the zero-obliquity SyntheticSynchronous() instance and the periapsis on a circular fixture, each of which must return NotEvaluable; and an equinox instant computed with the equator's ascending node longitude plus pi in place of the node, which must fail the increasing test)"
