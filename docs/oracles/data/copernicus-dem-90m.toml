# Copernicus DEM GLO-90: 90 m global DEM, cloud-optimised GeoTIFF tiles, DECLARED REGIONS ONLY

id = "copernicus-dem-90m"
title = "Copernicus DEM - Global and European Digital Elevation Model (GLO-90)"
publisher = "European Space Agency / Airbus"
doi = "10.5270/ESA-c5d3d65"
source = "https://copernicus-dem-90m.s3.amazonaws.com/ (AWS Open Data, no credentials)"
handbook = "esa2022-copernicus-dem-product-handbook.pdf (references/pdf)"
fetched = 2026-09-08
local_path = "oracles/data/copernicus-dem-90m"  # untracked payload
recipe = "oracles/recipes/copernicus_fetch.sh with oracles/recipes/copernicus_regions_tiles.tsv"
coverage = "regional, not global: the records that cite this DEM use it at declared boxes only, and a global GLO-90 pull (about 26,000 tiles) is deferred; extending coverage is a re-run of the recipe with more boxes, recorded here as a new fetch date"
vertical_reference = "EGM2008 geoid, per the product handbook"
tile_shape_note = "one-degree COG tiles, 1200 x 1200 at 3 arc-second"
anchors = ["REQ-HYD-001", "REQ-TER-016", "M1", "M2"]

[[region]]
name = "great_salt_lake_basin"
box = "lon -114.5 to -110.5, lat 39.5 to 42.5"
anchor = "REQ-HYD-001 lake hypsometry: Great Salt Lake closed basin"
tiles = 20

[[region]]
name = "qaidam_basin"
box = "lon 89.5 to 99.5, lat 35.0 to 39.5"
anchor = "REQ-HYD-001 lake hypsometry: Qaidam closed basin"
tiles = 55

[[region]]
name = "drakensberg_escarpment"
box = "lon 28.8 to 29.8, lat -29.6 to -28.6"
anchor = "REQ-TER-016 escarpment relief anchor (full relief)"
tiles = 4

[[region]]
name = "free_state_plateau"
box = "lon 25.6 to 26.6, lat -29.0 to -28.0"
anchor = "REQ-TER-016 relief anchor (minimum relief, plateau)"
tiles = 2

