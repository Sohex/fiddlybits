# ETOPO 2022 Global Relief Model, 15 arc-second, ice-surface and bedrock elevation, netCDF tiles

id = "etopo2022"
title = "ETOPO 2022 15 Arc-Second Global Relief Model"
publisher = "NOAA National Centers for Environmental Information"
doi = "10.25921/fd45-gt74"
source = "https://www.ngdc.noaa.gov/thredds/fileServer/global/ETOPO2022/15s/"
paper = "macferrin2024-etopo-2022-global-dem-dataset.pdf (references/pdf)"
fetched = 2026-09-08
local_path = "oracles/data/etopo2022"  # untracked payload
recipe = "oracles/recipes/etopo_fetch.sh"
oracles = ["terrain.hypsometry_scale_matched", "terrain.channel_concavity", "terrain.hypsometric_integral_distribution"]
anchors = ["M1 terrain statistics: hypsometry, concavity, drainage density, relief", "M7 Earth bathymetry", "B1 sub-grid relief closure"]
products = ["surface: ice-surface elevation, 288 tiles of 15 x 15 degrees, full global coverage", "bed: bedrock elevation, 62 tiles; NCEI publishes bedrock tiles only where the bed differs from the ice surface (Greenland and Antarctica), so 62 is the complete product and elsewhere the surface tile is the bed"]
tile_shape = [3600, 3600]
variables = ["z (float32, metres)", "lat", "lon", "crs"]
vertical_reference = "as published: heights relative to the EGM2008 geoid per the ETOPO 2022 documentation; the geoid-height grid was deliberately not fetched"
not_fetched = ["bedrock and surface source-ID grids (compilation provenance)", "geoid height grid"]

[global_attributes_of_first_surface_tile]
GDAL_AREA_OR_POINT = "Area"
node_offset = "1"
GDAL_TIFFTAG_COPYRIGHT = "DOC/NOAA/NESDIS/NCEI > National Centers for Environmental Information, NESDIS, NOAA, U.S. Department of Commerce"
GDAL_TIFFTAG_DATETIME = "20220929130603.0"
GDAL_TIFFTAG_IMAGEDESCRIPTION = "Topography-Bathymetry; EGM2008 height"
Conventions = "CF-1.5"
GDAL = "GDAL 3.3.2, released 2021/09/01"
NCO = "netCDF Operators version 4.9.1 (Homepage = http://nco.sf.net, Code = http://github.com/nco/nco)"

