# Australian Groundwater Explorer state data download: NGIS geodatabases with water-level and salinity readings, eight states and territories

id = "aus-groundwater"
title = "Australian Groundwater Explorer State Data Download (NGIS geodatabase, water levels, salinity), all eight jurisdictions"
publisher = "Bureau of Meteorology (Australia), collating state agency data under the Water Regulations"
source = "https://www.bom.gov.au/water/groundwater/explorer/ (per-state download; no API serves the level values)"
metadata = "https://www.bom.gov.au/water/groundwater/explorer/metadata.shtml"
identifier = "no DOI; the per-state zip packages, hashed below"
fetched = 2026-08-20  # by the predecessor project; zips carried over from /home/cfutro/docs/world/references/aus_groundwater on 2026-09-08
local_path = "oracles/data/aus-groundwater"  # untracked payload
recipe = "oracles/recipes/aus_gw_sites.py"
anchors = ["REQ-HYD-002 water-table skill oracle (the arid analogue; Fan et al. 2013 Australian bars; bore purpose as the drawdown filter)", "M2"]
contents = "each zip: gdb_<STATE>/ngis_<STATE>.gdb (bores, logs, aquifers, management zones), level_<state>.csv (hydroid, hydrocode, bore_id, data_owner, bore_date, obs_point_datum in {DTW, RSWL, SWL, UNKNOWN}, result, quality_flag), salinity_<state>.csv, gw_state_README.txt"
note = "obs_point_datum DTW is depth below ground, Fan et al. 2013 quantity directly; RSWL is a head to subtract from land elevation; SWL is measured from the casing top and needs the bore stickup; quality flag codes are per agency and undefined in the README, so they are reported, never filtered."

