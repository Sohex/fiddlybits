# Seed questions for the calibration set: the sort of thing actually put to
# ask.py, so the calibration prompts look like the served ones.
#
# This bank covers the default token budget on its own. If you raise pack.rows in
# calib.toml, gen_trace.py makes up the shortfall by deriving further questions
# from the corpus.
#
# area matches the requirement-record areas under docs/requirements/; kind is one of
# the four named in paperqa.toml's retrieval instruction. Both ride along into the
# trace in case a later pass wants to weight by them.

