# PaperQA2 configuration for the references archive. Retrieval returns locators, never values.
# llm: any LiteLLM model string. Default is the local llama-server (tools/references/serve_llm.sh) speaking the
# OpenAI protocol. To use Anthropic instead, set llm = "anthropic/claude-sonnet-5" and put the key in ~/.anthropic_key
# (read at call time by ask.py, never written anywhere).
llm = "openai/local"
summary_llm = "openai/local"
# Thinking is off for both roles, and must stay in step with
# tools/references/calib/calib.toml, which is how the local model was calibrated:
# serving with reasoning on would put the model in front of a token distribution the
# quantization never saw. Measured 2026-09-10 (tools/references/calib/think_ab.py):
# with thinking off the answer call finished on its own in about 410 tokens with correct
# citation keys and covered more ground than the reasoning arm, which spent ~500 tokens
# planning and then truncated. The evidence call is extractive and JSON-shaped and never
# wanted reasoning. Sent as enable_thinking, both bare and under chat_template_kwargs.
# TabbyAPI reads chat_template_kwargs as an alias of its own template_vars, so the flag
# arrives; do not set template_vars_force on the server, which overrides what is sent
# here and would serve the model in a mode the quantization was not calibrated for.
thinking = false
# TabbyAPI on its default port, serving the exl3 quant. llama-server ran on 8080.
api_base = "http://127.0.0.1:5000/v1"
embedding = "custom"                  # name recorded in the index; the model itself is embedding_path below
embedding_path = "/home/cfutro/models/Qwen3-Embedding-8B"   # set by the A/B/C of 2026-09-08, notes/findings
embedding_kind = "qwen3"              # qwen3 | jina | st
query_instruction = "Given a question about a physical law, numerical scheme, dataset or constant, retrieve the page of a scientific paper or book that states it"
max_seq = 2048
# auto | cuda | cpu. auto puts the embedder on the card when more than 18 GiB is free, which is the 8B model at
# fp16 plus its activations, and on the CPU otherwise. The choice is printed with the free VRAM that decided it:
# on the CPU this model is about fifty times slower and the only other sign is a full, idle card.
embedding_device = "auto"
paper_directory = "references/pdf"
index_directory = "references/index"
evidence_k = 12                       # chunks summarised per question; what the rerank stage returns
answer_max_sources = 6

# Cross-encoder rerank stage (tools/references/rerank.py). Retrieval pulls rerank_fetch_k
# and the reranker keeps the best evidence_k of them, so recall comes from the broad pull
# and precision from the cross-encoder, which reads query and page together instead of
# comparing two vectors built apart. Set rerank_path empty to turn the stage off; it is
# empty until the A/B in notes/findings picks a reranker, because 0.6B fp16 and 4B at
# int8 are the two that fit beside the served generator and they have not been compared.
# rerank_quant is bitsandbytes: none | int8 | nf4. rerank_vram_gib is the free VRAM below
# which the stage runs on CPU instead. It was 3.0, which is above what the card has free
# once TabbyAPI is serving, so every query reranked on the CPU and paid 60 s for it: the
# whole cost of an 83 s query, against 4 s for the embedder. Measured 2026-09-10,
# notes/findings/2026-09-10-rerank-stage-on-the-cpu.md.
#
# 1.5 and rerank_batch_size = 1 belong together and neither is free to move alone. At the
# default batch of 4 the stage loads onto the card and then runs out of memory mid-pass;
# PaperQA catches that inside gather_evidence and gen_answer, so the query returns an
# empty answer in 9 s and the wall clock reads like a speedup. Batch 1 peaks at 1.24 GiB
# against 2.3 GiB free and answers in 24 s. Larger batches buy 0.09 s across the whole
# shortlist, because 50 sequences of about 2000 tokens already saturate the card.
rerank_path = "/home/cfutro/models/Qwen3-Reranker-0.6B"
rerank_kind = "qwen3"
rerank_quant = "none"
rerank_fetch_k = 50
rerank_batch_size = 1
rerank_vram_gib = 1.5
rerank_instruction = "Given a question about a physical law, numerical scheme, dataset or constant, judge whether the page of a scientific paper or book states it"
chunk_chars = 4000
overlap = 200
